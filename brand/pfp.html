<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LeveretOS PFP</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --accent: #4ade80;
      --text: #e6edf3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #222;               
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #999;
    }

   
    .pfp {
      width: 512px;
      height: 512px;
      background:
        radial-gradient(circle at 50% 38%, #1b2230 0%, var(--bg) 70%);
      border-radius: 24px;           
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      position: relative;
      overflow: hidden;
    }

    
    .pfp::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          transparent 1px,
          transparent 4px
        );
      pointer-events: none;
    }

    .hare {
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 0 18px rgba(74, 222, 128, 0.35));
    }

    .wordmark {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text);
      z-index: 1;
    }
    .wordmark .os { color: var(--accent); }
    .wordmark .cursor {
      display: inline-block;
      width: 0.55ch;
      background: var(--accent);
      color: transparent;
      margin-left: 3px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .hint {
      max-width: 512px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="pfp" id="pfp">
   
    <svg class="hare" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
     
      <ellipse cx="38" cy="30" rx="7" ry="24" transform="rotate(-12 38 30)"
               fill="#4ade80"/>
      <ellipse cx="38" cy="30" rx="3" ry="17" transform="rotate(-12 38 30)"
               fill="#0d1117"/>
      
      <ellipse cx="58" cy="28" rx="7" ry="24" transform="rotate(8 58 28)"
               fill="#4ade80"/>
      <ellipse cx="58" cy="28" rx="3" ry="17" transform="rotate(8 58 28)"
               fill="#0d1117"/>
      <!-- head -->
      <circle cx="49" cy="58" r="24" fill="#4ade80"/>
      <!-- eyes -->
      <circle cx="41" cy="55" r="3.4" fill="#0d1117"/>
      <circle cx="57" cy="55" r="3.4" fill="#0d1117"/>
      <!-- nose -->
      <circle cx="49" cy="64" r="2.6" fill="#0d1117"/>
    </svg>

    <div class="wordmark">Leveret<span class="os">OS</span><span class="cursor">_</span></div>
  </div>

  <p class="hint">
    Screenshot only the square above (512&times;512). zoom the browser in first for a better capture.
  </p>

</body>
</html>
