<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- dark rounded background so the icon reads on any tab color -->
  <rect width="100" height="100" rx="20" fill="#0d1117"/>
  <!-- left ear -->
  <ellipse cx="38" cy="30" rx="7" ry="24" transform="rotate(-12 38 30)" fill="#4ade80"/>
  <ellipse cx="38" cy="30" rx="3" ry="17" transform="rotate(-12 38 30)" fill="#0d1117"/>
  <!-- right ear -->
  <ellipse cx="58" cy="28" rx="7" ry="24" transform="rotate(8 58 28)" fill="#4ade80"/>
  <ellipse cx="58" cy="28" rx="3" ry="17" transform="rotate(8 58 28)" fill="#0d1117"/>
  <!-- head -->
  <circle cx="49" cy="58" r="24" fill="#4ade80"/>
  <!-- eyes -->
  <circle cx="41" cy="55" r="3.4" fill="#0d1117"/>
  <circle cx="57" cy="55" r="3.4" fill="#0d1117"/>
  <!-- nose -->
  <circle cx="49" cy="64" r="2.6" fill="#0d1117"/>
</svg>
